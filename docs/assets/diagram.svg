<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="encoder-decoder-title encoder-decoder-desc">
      <title id="encoder-decoder-title">Learnable Denoising Sparse Wavelet Network</title>
      <desc id="encoder-decoder-desc">The Encoding Block splits an activation across convolution and downsampling paths, while the Decoding Block upsamples two inputs, applies transposed convolutions, and sums the results.</desc>
      <defs>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=STIX+Two+Text:wght@400;600&amp;display=swap');
          .zone-label, .legend-label, .legend-item { font-family: "Geist Mono", ui-monospace, monospace; font-size: 8px; fill: #7a8399; }
          .node-name { font-family: "Geist", system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
          .math { font-family: "STIX Two Text", "Cambria Math", serif; }
          .data-label { font-family: "STIX Two Text", "Cambria Math", serif; font-size: 20px; fill: #2d3142; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="960" height="400" fill="#f5f5f5"/>

      <g transform="translate(0 -48)">
      <!-- zones -->
      <rect x="92" y="72" width="384" height="256" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="104" y="76" width="128" height="16" rx="4" fill="#f5f5f5"/>
      <text x="168" y="88" text-anchor="middle" class="zone-label">Encoding Block <tspan class="math">E</tspan><tspan class="math" baseline-shift="super">ℓ</tspan></text>

      <rect x="492" y="72" width="380" height="256" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="504" y="76" width="128" height="16" rx="4" fill="#f5f5f5"/>
      <text x="568" y="88" text-anchor="middle" class="zone-label">Decoding Block <tspan class="math">D</tspan><tspan class="math" baseline-shift="super">ℓ</tspan></text>

      <!-- encoder connectors -->
      <line x1="84" y1="208" x2="104" y2="208" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M 104,208 V 168 Q 104,160 112,160 H 128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 104,208 V 248 Q 104,256 112,256 H 128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="208" y1="160" x2="252" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="284" y1="160" x2="416" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="208" y1="256" x2="252" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="284" y1="256" x2="328" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="392" y1="256" x2="416" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- decoder connectors -->
      <line x1="532" y1="160" x2="572" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="604" y1="160" x2="636" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="532" y1="256" x2="572" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="604" y1="256" x2="636" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 748,160 H 808 Q 816,160 816,168 V 196" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M 748,256 H 808 Q 816,256 816,248 V 220" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="828" y1="208" x2="884" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- encoder data -->
      <text x="40" y="216" class="data-label">a<tspan baseline-shift="super" font-size="12">(ℓ-1)</tspan></text>
      <text x="428" y="168" class="data-label">a<tspan baseline-shift="super" font-size="12">ℓ</tspan></text>
      <text x="428" y="264" class="data-label">d<tspan baseline-shift="super" font-size="12">ℓ</tspan></text>

      <!-- encoder nodes -->
      <rect x="128" y="136" width="80" height="48" rx="8" fill="#f5f5f5"/>
      <rect x="128" y="136" width="80" height="48" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="168" y="156" text-anchor="middle" class="node-name">Conv. Layer</text>
      <text x="168" y="176" text-anchor="middle" class="node-name math">h<tspan baseline-shift="super" font-size="8">ℓ</tspan></text>

      <circle cx="268" cy="160" r="16" fill="#f5f5f5"/>
      <circle cx="268" cy="160" r="16" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="268" y="164" text-anchor="middle" class="node-name">↓ 2</text>

      <rect x="128" y="232" width="80" height="48" rx="8" fill="#f5f5f5"/>
      <rect x="128" y="232" width="80" height="48" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="168" y="252" text-anchor="middle" class="node-name">Conv. Layer</text>
      <text x="168" y="272" text-anchor="middle" class="node-name math">g<tspan baseline-shift="super" font-size="8">ℓ</tspan></text>

      <circle cx="268" cy="256" r="16" fill="#f5f5f5"/>
      <circle cx="268" cy="256" r="16" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="268" y="260" text-anchor="middle" class="node-name">↓ 2</text>

      <rect x="328" y="232" width="64" height="48" rx="8" fill="#f5f5f5"/>
      <rect x="328" y="232" width="64" height="48" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="360" y="264" text-anchor="middle" class="node-name math">HT<tspan baseline-shift="super" font-size="8">ℓ</tspan></text>

      <!-- decoder data -->
      <text x="500" y="168" class="data-label">ā<tspan baseline-shift="super" font-size="12">ℓ</tspan></text>
      <text x="504" y="264" class="data-label">d<tspan baseline-shift="super" font-size="12">ℓ</tspan></text>

      <!-- decoder nodes -->
      <circle cx="588" cy="160" r="16" fill="#f5f5f5"/>
      <circle cx="588" cy="160" r="16" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="588" y="164" text-anchor="middle" class="node-name">↑ 2</text>

      <rect x="636" y="128" width="112" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="636" y="128" width="112" height="64" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="692" y="156" text-anchor="middle" class="node-name">Conv. Transpose</text>
      <text x="692" y="176" text-anchor="middle" class="node-name">Layer <tspan class="math">h̄</tspan><tspan class="math" baseline-shift="super" font-size="8">ℓ</tspan></text>

      <circle cx="588" cy="256" r="16" fill="#f5f5f5"/>
      <circle cx="588" cy="256" r="16" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="588" y="260" text-anchor="middle" class="node-name">↑ 2</text>

      <rect x="636" y="224" width="112" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="636" y="224" width="112" height="64" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="692" y="252" text-anchor="middle" class="node-name">Conv. Transpose</text>
      <text x="692" y="272" text-anchor="middle" class="node-name">Layer <tspan class="math">ḡ</tspan><tspan class="math" baseline-shift="super" font-size="8">ℓ</tspan></text>

      <circle cx="816" cy="208" r="12" fill="#f5f5f5"/>
      <circle cx="816" cy="208" r="12" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="816" y="212" text-anchor="middle" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#2d3142">+</text>

      <text x="896" y="216" class="data-label">ā<tspan baseline-shift="super" font-size="12">(ℓ-1)</tspan></text>
      </g>

      <g transform="translate(0 -200)">
      <!-- legend -->
      <line x1="40" y1="504" x2="920" y2="504" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="528" class="legend-label">Legend</text>
      <rect x="128" y="516" width="32" height="24" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="172" y="532" class="legend-item">Learnable</text>
      <circle cx="284" cy="528" r="12" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="308" y="532" class="legend-item">Dyadic up/down sampling (stride 2)</text>
      <text x="520" y="532" class="node-name math">HT</text>
      <text x="548" y="532" class="legend-item">Hard-thresholding activation</text>

      <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="564" class="legend-label">Analogy</text>
      <text x="40" y="584" class="legend-label">to DWT</text>

      <text x="128" y="564" class="node-name math">h</text>
      <text x="148" y="564" class="legend-item">Scaling (low-pass) filter</text>
      <text x="128" y="584" class="node-name math">g</text>
      <text x="148" y="584" class="legend-item">Wavelet (high-pass) filter</text>

      <text x="300" y="564" class="node-name math">a</text>
      <text x="320" y="564" class="legend-item">Approximation</text>
      <text x="300" y="584" class="node-name math">d</text>
      <text x="320" y="584" class="legend-item">Detail</text>

      </g>
    </svg>
