<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learnable Denoising Sparse Wavelet Network</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=STIX+Two+Text:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --sans: "Geist", system-ui, sans-serif;
      --serif: "Instrument Serif", serif;
      --mono: "Geist Mono", ui-monospace, monospace;
      --math: "STIX Two Text", "Cambria Math", serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    main { width: min(100%, 1040px); }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.12em;
    }
    h1 {
      margin-bottom: 24px;
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 400;
      line-height: 1.15;
    }
    svg { display: block; width: 100%; min-width: 760px; }
    .zone-label, .legend-label, .legend-item {
      font-family: var(--mono);
      font-size: 8px;
      fill: var(--soft);
    }
    .node-name { font-family: var(--sans); font-size: 12px; font-weight: 600; fill: var(--ink); }
    .math { font-family: var(--math); }
    .data-label { font-family: var(--math); font-size: 20px; fill: var(--ink); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Architecture Overview</p>
    <h1>Learnable Denoising Sparse Wavelet Network</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="encoder-decoder-title encoder-decoder-desc">
      <title id="encoder-decoder-title">Learnable Denoising Sparse Wavelet Network</title>
      <desc id="encoder-decoder-desc">The Encoding Block splits an activation across convolution and downsampling paths, while the Decoding Block upsamples two inputs, applies transposed convolutions, and sums the results.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>

      <!-- zones -->
      <rect x="92" y="72" width="384" height="344" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="104" y="76" width="128" height="16" rx="4" fill="#f5f5f5"/>
      <text x="168" y="88" text-anchor="middle" class="zone-label">Encoding Block <tspan class="math">E</tspan><tspan class="math" baseline-shift="super">ℓ</tspan></text>

      <rect x="492" y="72" width="380" height="344" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="504" y="76" width="128" height="16" rx="4" fill="#f5f5f5"/>
      <text x="568" y="88" text-anchor="middle" class="zone-label">Decoding Block <tspan class="math">D</tspan><tspan class="math" baseline-shift="super">ℓ</tspan></text>

      <!-- encoder connectors -->
      <path d="M 88,236 H 96 Q 104,236 104,228 V 168 Q 104,160 112,160 H 128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 88,236 H 96 Q 104,236 104,244 V 304 Q 104,312 112,312 H 128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="208" y1="160" x2="228" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="276" y1="160" x2="404" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="208" y1="312" x2="228" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="276" y1="312" x2="324" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="388" y1="312" x2="416" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- decoder connectors -->
      <line x1="532" y1="160" x2="564" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="612" y1="160" x2="644" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="532" y1="312" x2="564" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="612" y1="312" x2="644" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 740,160 H 752 Q 760,160 760,168 V 208 Q 760,216 768,216 H 792" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 740,312 H 752 Q 760,312 760,304 V 240 Q 760,232 768,232 H 792" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="840" y1="224" x2="884" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- encoder data -->
      <text x="40" y="244" class="data-label">a<tspan baseline-shift="super" font-size="12">(ℓ-1)</tspan></text>
      <circle cx="88" cy="236" r="4" fill="#4f5d75"/>
      <text x="416" y="168" class="data-label">a<tspan baseline-shift="super" font-size="12">ℓ</tspan></text>
      <text x="428" y="320" class="data-label">d<tspan baseline-shift="super" font-size="12">ℓ</tspan></text>

      <!-- encoder nodes -->
      <rect x="128" y="136" width="80" height="48" rx="8" fill="#f5f5f5"/>
      <rect x="128" y="136" width="80" height="48" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="168" y="156" text-anchor="middle" class="node-name">Conv.</text>
      <text x="168" y="176" text-anchor="middle" class="node-name math">h<tspan baseline-shift="super" font-size="8">ℓ</tspan></text>

      <circle cx="252" cy="160" r="24" fill="#f5f5f5"/>
      <circle cx="252" cy="160" r="24" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="252" y="168" text-anchor="middle" class="node-name">↓ 2</text>

      <rect x="128" y="288" width="80" height="48" rx="8" fill="#f5f5f5"/>
      <rect x="128" y="288" width="80" height="48" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="168" y="308" text-anchor="middle" class="node-name">Conv.</text>
      <text x="168" y="328" text-anchor="middle" class="node-name math">g<tspan baseline-shift="super" font-size="8">ℓ</tspan></text>

      <circle cx="252" cy="312" r="24" fill="#f5f5f5"/>
      <circle cx="252" cy="312" r="24" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="252" y="320" text-anchor="middle" class="node-name">↓ 2</text>

      <rect x="324" y="288" width="64" height="48" rx="8" fill="#f5f5f5"/>
      <rect x="324" y="288" width="64" height="48" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="356" y="320" text-anchor="middle" class="node-name math">HT<tspan baseline-shift="super" font-size="8">ℓ</tspan></text>

      <!-- decoder data -->
      <text x="500" y="168" class="data-label">ā<tspan baseline-shift="super" font-size="12">ℓ</tspan></text>
      <text x="504" y="320" class="data-label">d<tspan baseline-shift="super" font-size="12">ℓ</tspan></text>

      <!-- decoder nodes -->
      <circle cx="588" cy="160" r="24" fill="#f5f5f5"/>
      <circle cx="588" cy="160" r="24" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="588" y="168" text-anchor="middle" class="node-name">↑ 2</text>

      <rect x="644" y="128" width="96" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="644" y="128" width="96" height="64" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="692" y="156" text-anchor="middle" class="node-name">Transposed</text>
      <text x="692" y="176" text-anchor="middle" class="node-name">Conv. <tspan class="math">h̄</tspan><tspan class="math" baseline-shift="super" font-size="8">ℓ</tspan></text>

      <circle cx="588" cy="312" r="24" fill="#f5f5f5"/>
      <circle cx="588" cy="312" r="24" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="588" y="320" text-anchor="middle" class="node-name">↑ 2</text>

      <rect x="644" y="280" width="96" height="64" rx="8" fill="#f5f5f5"/>
      <rect x="644" y="280" width="96" height="64" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="692" y="308" text-anchor="middle" class="node-name">Transposed</text>
      <text x="692" y="328" text-anchor="middle" class="node-name">Conv. <tspan class="math">ḡ</tspan><tspan class="math" baseline-shift="super" font-size="8">ℓ</tspan></text>

      <circle cx="816" cy="224" r="24" fill="#f5f5f5"/>
      <circle cx="816" cy="224" r="24" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="816" y="232" text-anchor="middle" font-family="Geist, sans-serif" font-size="20" font-weight="600" fill="#2d3142">+</text>

      <text x="896" y="232" class="data-label">ā<tspan baseline-shift="super" font-size="12">(ℓ-1)</tspan></text>

      <!-- legend -->
      <line x1="40" y1="504" x2="920" y2="504" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="528" class="legend-label">Legend</text>
      <rect x="128" y="516" width="32" height="24" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="172" y="532" class="legend-item">Learnable</text>
      <circle cx="284" cy="528" r="12" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="308" y="532" class="legend-item">Up/Down Sampling</text>

      <line x1="40" y1="548" x2="920" y2="548" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="572" class="legend-label">Notation</text>

      <text x="128" y="564" class="node-name math">h</text>
      <text x="148" y="564" class="legend-item">High pass</text>
      <text x="128" y="584" class="node-name math">g</text>
      <text x="148" y="584" class="legend-item">Low pass</text>

      <text x="300" y="564" class="node-name math">a</text>
      <text x="320" y="564" class="legend-item">Approximation</text>
      <text x="300" y="584" class="node-name math">d</text>
      <text x="320" y="584" class="legend-item">Detail</text>

      <text x="496" y="564" class="node-name math">HT</text>
      <text x="524" y="564" class="legend-item">Hard-thresholding activation</text>
    </svg>
  </main>
</body>
</html>
