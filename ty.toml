[rules]
division-by-zero = "warn"
missing-type-argument = "warn"
possibly-unresolved-reference = "warn"

[src]
# Lock what gets checked so "ty check" and "ty check ." act the same
include = ["./src/", "./tests/"]
exclude = ["./tests/legacy/"]

[environment]
root = ["./src/"]

[terminal]
error-on-warning = false
